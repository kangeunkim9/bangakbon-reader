name: 웹 판독기 배포
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 웹 파일만 모으기
        run: |
          mkdir _site
          cp web/index.html web/contributors.html web/sample.jpg web/charset_v*.json web/model_v*_*.wasm web/ort-wasm-simd.wasm web/lm7.gz.wasm web/spacer.wasm web/spacer_vocab.json web/ndl_layout_*.wasm _site/
          cp -r web/licenses _site/
          if [ -d web/pre ]; then cp -r web/pre _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # 배포 단계가 GitHub 쪽 일시 오류(묶음을 못 찾음)로 가끔 실패해서, 30초 쉬고 한 번 더 한다
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deployment
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
